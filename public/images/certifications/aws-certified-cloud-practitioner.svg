<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="awsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232F3E"/>
      <stop offset="100%" stop-color="#131921"/>
    </linearGradient>
    <linearGradient id="awsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="url(#awsBg)" stroke="url(#awsGold)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner Border -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- AWS Text / Logo Arc -->
  <text x="100" y="58" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AWS CERTIFIED</text>
  <path d="M 65 72 Q 100 86 135 72" fill="none" stroke="#FF9900" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="135,72 131,66 139,69" fill="#FF9900"/>
  <!-- Center Ribbon -->
  <rect x="35" y="94" width="130" height="32" rx="4" fill="#FF9900"/>
  <text x="100" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#131921" text-anchor="middle">CLOUD</text>
  <text x="100" y="121" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#131921" text-anchor="middle">PRACTITIONER</text>
  <!-- Level Badge -->
  <text x="100" y="158" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">FOUNDATIONAL</text>
</svg>