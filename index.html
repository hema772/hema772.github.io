      <!--
        Analytics are injected at runtime (below) rather than declared as
        static <script> tags so they don't block first paint AND so SRI
        requirements don't apply -- both GTM and SimpleAnalytics serve
        continuously-updated bundles that would break any fixed integrity hash.
      -->
      <script type="module">
         var metaEnv =
            typeof import.meta !== "undefined" && import.meta.env
               ? import.meta.env
               : {};
         var analyticsEnabled = metaEnv.VITE_ANALYTICS_ENABLED === "true";
         var gaId = metaEnv.VITE_GA_ID;

         if (analyticsEnabled) {
            // After load and then idle: on a phone, gtag parsing during the
            // hero render cost about a second of main thread (Lighthouse trace).
            var inject = function () {
               var d = globalThis.document;

               // SimpleAnalytics
               var sa = d.createElement("script");
               sa.async = true;
               sa.defer = true;
               sa.src = "https://scripts.simpleanalyticscdn.com/latest.js";
               d.body.appendChild(sa);

               // Google Analytics (gtag) - only initialized if tracking ID configured
               if (gaId) {
                  var ga = d.createElement("script");
                  ga.async = true;
                  ga.src =
                     "https://www.googletagmanager.com/gtag/js?id=" +
                     encodeURIComponent(gaId);
                  d.body.appendChild(ga);

                  globalThis.dataLayer = globalThis.dataLayer || [];
                  function gtag() {
                     globalThis.dataLayer.push(arguments);
                  }
                  gtag("js", new Date());
                  gtag("config", gaId);
               }
            };
            globalThis.addEventListener("load", function () {
               var idle =
                  globalThis.requestIdleCallback ||
                  function (cb) {
                     return setTimeout(cb, 1);
                  };
               idle(inject, { timeout: 4000 });
            });
         }
      </script>
